name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      # tests that download the 220 MB model or need a real desktop session are left to local runs
      - run: dotnet test -c Release --no-build --filter "FullyQualifiedName!~RealModelTests&FullyQualifiedName!~Captures_screen"
